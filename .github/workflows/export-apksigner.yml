name: Export Android 36 APK signing tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-apksigner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Export official signing tools (never signing keys)
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"
          mkdir -p export
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" export/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" export/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" export/aapt
          sha256sum export/* > export/tool-sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-36-official-signing-tools
          path: export/
          retention-days: 2
